<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admissions SMS Automation - GH Schools</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <div class="admin-layout">
        <main class="main-content">
            <div class="page-content">
                <div class="section-header" style="margin-bottom: 2rem;">
                    <h2>Admissions SMS Automation</h2>
                    <p style="color: #64748b;">Configure automatic SMS triggers for successful admission payments.</p>
                </div>

                <div class="template-grid" id="automationContainer">
                    <!-- The Card will be injected here by JS -->
                    <div class="loading">Loading configuration...</div>
                </div>
            </div>
        </main>
    </div>

    <script src="global.js"></script>
    <script>
        // --- CONFIG ---
        const AUTOMATION_CATEGORY = 'AUTOMATION';

        async function loadAutomations() {
            const container = document.getElementById('automationContainer');

            // Fetch all automation-related templates
            const { data, error } = await supabase
                .from('sms_templates')
                .select('*')
                .eq('category', AUTOMATION_CATEGORY)
                .order('template_name', { ascending: true });

            if (error) {
                container.innerHTML = `<div class="error-msg" style="display:block">Error: ${error.message}</div>`;
                return;
            }

            container.innerHTML = ''; // Clear loading
            data.forEach(config => renderCard(config));
        }

        function renderCard(config) {
            const container = document.getElementById('automationContainer');
            const cardId = `card-${config.template_slug}`;

            // Dynamic variable tips based on slug
            const variables = config.template_slug === 'adm_form_purchase'
                ? '{{first_name}}, {{username}}, {{password}}, {{url}}'
                : '{{first_name}}, {{username}}, {{password}}, {{url}}';

            const cardHtml = `
        <div class="template-card" id="${cardId}" style="margin-bottom: 2rem; border-left: 4px solid var(--primary);">
            <div class="template-header">
                <div>
                    <div class="template-title">${config.template_name}</div>
                    <div class="template-slug">SLUG: ${config.template_slug}</div>
                </div>
                <label class="status-toggle">
                    <input type="checkbox" id="toggle-${config.template_slug}" ${config.is_active ? 'checked' : ''}>
                    <span>${config.is_active ? 'ACTIVE' : 'INACTIVE'}</span>
                </label>
            </div>

            <div class="form-group">
                <label>Base URL</label>
                <input type="text" id="url-${config.template_slug}" value="${config.base_url || ''}">
            </div>

            <div class="form-group">
                <label>Target Page</label>
                <input type="text" id="page-${config.template_slug}" value="${config.target_page || ''}">
            </div>

            <div class="form-group">
                <label>Message Template</label>
                <textarea id="msg-${config.template_slug}" class="template-editor">${config.message_content || ''}</textarea>
            </div>

            <div class="variables-tip">Variables: <span class="variable-tag">${variables}</span></div>

            <div class="card-actions">
                <button onclick="saveAutomation('${config.template_slug}')" class="btn-primary" style="width: auto; padding: 0.5rem 2rem;">
                    <i class="fas fa-save"></i> Save ${config.template_name}
                </button>
            </div>
        </div>
    `;
            container.insertAdjacentHTML('beforeend', cardHtml);
        }

        async function saveAutomation(slug) {
            const is_active = document.getElementById(`toggle-${slug}`).checked;
            const base_url = document.getElementById(`url-${slug}`).value;
            const target_page = document.getElementById(`page-${slug}`).value;
            const message_content = document.getElementById(`msg-${slug}`).value;

            const { error } = await supabase
                .from('sms_templates')
                .update({ is_active, base_url, target_page, message_content })
                .eq('template_slug', slug);

            if (error) {
                alert("Error: " + error.message);
            } else {
                alert(`${slug} updated successfully!`);
                loadAutomations();
            }
        }

        // Initial Load
        document.addEventListener('DOMContentLoaded', () => {
            checkSessionAndRenderLayout();
            loadAutomations();
        });
    </script>
</body>

</html>
