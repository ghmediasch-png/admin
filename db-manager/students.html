<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Management</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- CSV Parser Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="students.css">
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar injected by global.js -->
        
        <div class="main-content">
            <div class="page-content">
                
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <div>
                        <h1>Student Database</h1>
                        <p style="color:#64748b;">Manage master records for the API.</p>
                    </div>
                    <div style="display:flex; gap:10px;">
                        <button onclick="openBulkModal()" class="btn-retry">
                            <i class="fas fa-file-csv"></i> Bulk Upload
                        </button>
                        <button onclick="openStudentModal()" class="btn-primary" style="width:auto;">
                            <i class="fas fa-plus"></i> Add Student
                        </button>
                    </div>
                </div>

                <!-- Toolbar (Search) -->
                <div id="studentToolbar"></div>

                <!-- Data Table -->
                <div class="table-container">
                    <table class="data-table" id="studentTable">
                        <thead>
                            <tr>
                                <th>Student ID</th>
                                <th>Name</th>
                                <th>Contact</th>
                                <th>Academic</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="studentBody">
                            <tr><td colspan="5" style="text-align:center;">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div id="studentPagination"></div>
            </div>
        </div>
    </div>

    <!-- 1. Single Student Modal -->
    <div id="studentModal" class="sidebar-overlay" style="z-index:9000;">
        <div class="auth-card modal-card-default" style="max-width:700px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                <h2 id="modalTitle" style="margin:0;">Add Student</h2>
                <button onclick="closeModals()" style="border:none; background:none; font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            
            <form id="studentForm">
                <input type="hidden" id="recordId"> <!-- For Updates -->
                
                <!-- Compulsory Fields -->
                <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:15px; margin-bottom:15px;">
                    <div class="form-group">
                        <label>Student ID <span style="color:red">*</span></label>
                        <input type="text" id="stuId" required placeholder="GHMS..." style="text-transform:uppercase;">
                    </div>
                    <div class="form-group">
                        <label>First Name <span style="color:red">*</span></label>
                        <input type="text" id="stuFirst" required>
                    </div>
                    <div class="form-group">
                        <label>Surname <span style="color:red">*</span></label>
                        <input type="text" id="stuSur" required>
                    </div>
                </div>

                <!-- Optional Fields -->
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                    <div class="form-group">
                        <label>Middle Name</label>
                        <input type="text" id="stuMid">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="stuEmail">
                    </div>
                    <div class="form-group">
                        <label>Phone 1</label>
                        <input type="tel" id="stuPhone1">
                    </div>
                    <div class="form-group">
                        <label>Phone 2</label>
                        <input type="tel" id="stuPhone2">
                    </div>
                    <div class="form-group">
                        <label>School</label>
                        <input type="text" id="stuSchool">
                    </div>
                    <div class="form-group">
                        <label>Program</label>
                        <input type="text" id="stuProgram">
                    </div>
                    <div class="form-group">
                        <label>Pathway</label>
                        <input type="text" id="stuPathway" placeholder="e.g. General Arts">
                    </div>
                </div>

                <div style="text-align:right; margin-top:20px;">
                    <button type="button" onclick="closeModals()" class="btn-retry">Cancel</button>
                    <button type="submit" class="btn-primary" style="width:auto;">Save Student</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 2. Bulk Upload Modal -->
    <div id="bulkModal" class="sidebar-overlay" style="z-index:9000;">
        <div class="auth-card modal-card-default">
            <h2 style="margin-bottom:10px;">Bulk Upload</h2>
            <p style="color:#64748b; font-size:0.9rem; margin-bottom:20px;">
                Upload a CSV file to update the database. Existing Student IDs will be updated (Upsert).
            </p>

            <div class="upload-zone" id="dropZone">
                <i class="fas fa-cloud-upload-alt" style="font-size:2rem; color:#cbd5e1; margin-bottom:10px;"></i>
                <p>Drag & Drop CSV here or click to browse</p>
                <input type="file" id="csvInput" accept=".csv" style="display:none;">
                <button onclick="document.getElementById('csvInput').click()" class="btn-outline">Select File</button>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center;">
                <button onclick="downloadTemplate()" class="btn-retry" style="font-size:0.8rem;">
                    <i class="fas fa-download"></i> Download Template
                </button>
                <button onclick="processBulkUpload()" id="btnUpload" class="btn-primary" style="width:auto;" disabled>
                    Start Upload
                </button>
            </div>

            <!-- Progress Bar -->
            <div id="progressContainer" class="progress-bar-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <div id="uploadStatus" style="margin-top:10px; font-size:0.85rem; color:#64748b; text-align:center;"></div>
        </div>
    </div>

    <script src="../global.js"></script>
    <script src="../list-controller.js"></script>
    <script src="students.js"></script>
    <script>checkSessionAndRenderLayout();</script>
</body>
</html>
