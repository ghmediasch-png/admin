<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Ledger</title>
    
    <!-- Libraries -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar injected by global.js -->
        
        <div class="main-content">
            <div class="page-content">
                
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
                    <div>
                        <h1>Payment Ledger</h1>
                        <p style="color:#64748b;">Comprehensive financial records.</p>
                    </div>
                    <button onclick="exportPayments()" class="btn-retry">
                        <i class="fas fa-file-csv"></i> Export Data
                    </button>
                </div>

                <!-- 1. Stats Summary (Today) -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-label">Total Revenue (Today)</span>
                        <span class="stat-value" id="statTotal">GH₵ 0.00</span>
                        <span class="stat-sub">Across all sources</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">API Revenue</span>
                        <span class="stat-value" id="statApi">GH₵ 0.00</span>
                        <span class="stat-sub">Via Bank Integration</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-label">Manual Revenue</span>
                        <span class="stat-value" id="statManual">GH₵ 0.00</span>
                        <span class="stat-sub">Direct Entries</span>
                    </div>
                </div>

                <!-- 2. List Toolbar -->
                <div id="paymentToolbar"></div>

                <!-- 3. Data Table -->
                <div class="table-container">
                    <table class="data-table" id="paymentTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Student</th>
                                <th>Amount</th>
                                <th>Reference</th>
                                <th>Source</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="paymentBody">
                            <tr><td colspan="6" style="text-align:center;">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- 4. Pagination -->
                <div id="paymentPagination"></div>
            </div>
        </div>
    </div>

    <!-- Logic -->
    <script src="global.js"></script>
    <script src="list-controller.js"></script>
    <script src="payments.js"></script>
    
    <script>
        // Security Check: Only Super Admin should see this page content
        // global.js will eventually redirect if not allowed, but we double check here
        async function init() {
            await checkSessionAndRenderLayout();
            // Load stats after layout is ready
            loadDailyStats();
        }
        init();
    </script>
</body>
</html>
